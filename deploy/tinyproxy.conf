# Forward-proxy sidecar: `service` has no route to the internet except
# through this proxy, and this proxy allows CONNECT only to allowlisted
# hosts (see tinyproxy.filter). Same pattern as train-tracker's own
# egress-proxy.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 30
MaxClients 10

LogLevel Info

# HTTPS support: the client CONNECTs through us to the real TLS endpoint,
# we never see the decrypted traffic.
ConnectPort 443

Filter "/etc/tinyproxy/tinyproxy.filter"
FilterExtended On
FilterDefaultDeny Yes

DisableViaHeader Yes
