# Compose defaults a project name to this directory's basename, which
# would collide with any other project that also names its compose
# directory `deploy` on the same host.
name: train-tracker-query-web

services:
  # `service` has no route to the internet except through this proxy
  # (see the `ingress` network below — internal, no NAT). Only Groq and
  # Langfuse are allowlisted; train-tracker's API is tailnet-only and
  # reachable through the `tailscale` sidecar's own proxy instead, not
  # through this one.
  egress-proxy:
    image: docker.io/vimagick/tinyproxy:latest@sha256:72b441b95ee1e641af948f68f09492f9f795ead72b73954414e339168c98ad8c
    restart: unless-stopped
    read_only: true
    volumes:
      - ./tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./tinyproxy.filter:/etc/tinyproxy/tinyproxy.filter:ro
    networks:
      - ingress
      - egress

  service:
    build:
      context: ../service
    image: train-tracker-query-web-service:local
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    env_file:
      - ../service/.env
    environment:
      HTTP_PROXY: http://egress-proxy:8888
      HTTPS_PROXY: http://egress-proxy:8888
      # Loopback exempted so in-container tooling can reach localhost
      # without punching a new egress-allowlist hole.
      NO_PROXY: "localhost,127.0.0.1"
      # tailscaled's own outbound proxy (see deploy/tailscale-entrypoint.sh),
      # reachable via `caddy` since `tailscale` shares its network
      # namespace — the only path to a tailnet-only host like
      # train-tracker's API. Deliberately separate from HTTP(S)_PROXY
      # above: next_service.py/stations_cache.py must use this one
      # explicitly (trust_env=False) rather than inherit the Groq/Langfuse
      # proxy, which can't route to the tailnet at all.
      TRAIN_TRACKER_PROXY_URL: http://caddy:1055
    # No published ports — only reachable from `caddy` on the internal
    # network. All outbound egress goes through egress-proxy (Groq/
    # Langfuse, allowlisted) or the tailscale sidecar's proxy
    # (train-tracker's tailnet-only API), never directly.
    networks:
      - ingress

  caddy:
    image: caddy:2.9-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    restart: unless-stopped
    read_only: true
    user: "1000:1000"
    tmpfs:
      - /tmp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ingress
      - public
    depends_on:
      - service

  # Shares Caddy's network namespace so it reaches Caddy over localhost and
  # never gains any network membership beyond exactly what Caddy already
  # has. Same pattern as train-tracker's own M3 setup.
  tailscale:
    image: tailscale/tailscale:latest@sha256:cdf5612ded5be1344f1a704b8c5e53496db97376bb533e5e15f141e48bf60cc0
    restart: unless-stopped
    network_mode: service:caddy
    cap_add:
      - NET_ADMIN
      - NET_RAW
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-entrypoint.sh:/entrypoint.sh:ro
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in deploy/.env}
      TS_HOSTNAME: ${TS_HOSTNAME:-train-tracker-query-web}
      TARGET_PORT: "8080"
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    depends_on:
      - caddy

networks:
  # No real outbound route on this network at all — Docker gives it no
  # NAT, not just a firewall rule that could be misconfigured. `service`
  # only ever accepts inbound from `caddy`, and reaches
  # `egress-proxy`/`caddy`'s proxy ports for anything outbound.
  ingress:
    internal: true
  # egress-proxy's only real outbound route — nothing else is a member.
  egress:
    driver: bridge
  # The only network with a real outbound route among `caddy`'s own
  # memberships — exists for the `tailscale` sidecar's own traffic,
  # inherited via `network_mode` on the `caddy` service it shares a
  # namespace with.
  public:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  tailscale_state:
